Syntax 4

# Legacy fallback UCM path for the OnePlus Pad 3 (erhai).
#
# WirePlumber's ACP layer opens the UCM with the ALSA *card ID* ("OnePlusPad3",
# from snd_ctl_card_info_get_id) rather than "hw:0". ALSA's UCM resolver only
# matches that name against the driver/name/longname fields, so the conf.d/
# lookup never fires and no ctl is opened. Without a ctl, ${CardId} is undefined
# and the verb's EnableSequence mixer writes have no "cdev" to run against.
#
# This directory is picked up by ucm.conf's legacy UseCasePath when the
# conf.d lookup misses, and uses a self-contained HiFi verb that hardcodes
# card 0 and opens its own control device with "cdev hw:0".

SectionUseCase."HiFi" {
    File "/OnePlusPad3/HiFi.conf"
    Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd939x/init.conf"
