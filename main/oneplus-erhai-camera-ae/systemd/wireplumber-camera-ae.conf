# oneplus-erhai-camera-ae: libcamera tuning override (Agc/Adjust off) for
# PipeWire camera apps.  The erhai-camera-ae.service engine owns exposure.
# Takes effect at the next start of this unit (log out and in, or reboot).
[Service]
Environment=LIBCAMERA_IPA_CONFIG_PATH=/usr/share/oneplus-erhai-camera-ae/ipa
