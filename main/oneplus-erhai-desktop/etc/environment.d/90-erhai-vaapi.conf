# erhai (2.39): select the patched VA-API driver and enable AV1 decoding on the
# VPU.  libva loads a driver by name, and iris-vaapi exposes AV1 only when it is
# asked to (the VPU path is the one that has to be picked, otherwise libva
# falls back to the plain H.264/VP9/HEVC driver without AV1).  /etc/environment
# gets the same two lines from this package's postinst, because a session that
# gdm starts through PAM never reads environment.d.
LIBVA_DRIVER_NAME=iris
IRIS_VAAPI_AV1=1
