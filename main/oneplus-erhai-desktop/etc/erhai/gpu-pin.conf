# erhai GPU runtime-PM policy (oneplus-erhai-desktop >= 2.25)
#
# MODE=once    (DEFAULT since 2.25)  Pin the Adreno only for the BOOT BRING-UP:
#              erhai-gpu-pin-once.service pins it before gdm (the bring-up
#              window that cannot be left unpinned — an unpinned boot could not
#              bring the desktop up) and releases it to runtime-PM 'auto' once
#              the GPU is demonstrably up: gdm running, panel lit, GPU active
#              and its clock above the idle floor, held for SETTLE seconds.
#              A released GPU is NOT re-pinned by a panel blank/restore
#              (erhai-panel-power.sh honours the release); an external DP
#              monitor always keeps it pinned.
# MODE=always  The pre-2.25 behaviour: erhai-gpu-pin.service pins the GPU
#              always-active on every boot (it never runtime-suspends, so the
#              intermittent CM3 resume hang can never fire; the cost is the GPU
#              idling at its floor).  ROLLBACK for the once-pin workaround:
#              set MODE=always and reinstall oneplus-erhai-desktop, or
#              `systemctl disable --now erhai-gpu-pin-once.service` +
#              `systemctl enable --now erhai-gpu-pin.service`.
MODE=once

# Seconds the "GPU is up" conditions must hold before the pin is released.
SETTLE=15

# Give up — and STAY PINNED — when the conditions never appear within this.
TIMEOUT=180