# erhai system-sleep policy (90-erhai-sleep-policy)
#
# BT_OFF=1  rfkill-block Bluetooth for the sleep window, restoring the
#           previous soft-block state on resume.  Default 0: on erhai the
#           whole WCN/BT block measured only ~0.02 W of the overnight draw
#           (2026-11-24 A/B), unlike the SM8550 handhelds where BT was the
#           single largest sleep consumer.
#
# RESUSPEND is reserved.  Automatic re-suspend is not implemented: the 7 h
# overnight run had exactly one suspend and no spurious wake, and a re-suspend
# loop is worse than a slightly shorter sleep after a real power-key press.
BT_OFF=0
