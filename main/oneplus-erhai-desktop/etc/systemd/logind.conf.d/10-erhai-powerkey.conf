[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
# A keyboard folio is not a lid: erhai-folio-fold handles the fold itself
# (backlight off, no suspend).  The BU52053NVX hall switch (TLMM gpio97, no
# pull, ACTIVE_LOW) floats on kernels that do not keep the sensor I/O rail on,
# and logind's default HandleLidSwitch=suspend then suspends the tablet ~10 s
# after boot and keeps re-requesting it (seen on the 7.2.15-yzddmr6 dev kernel,
# 2026-11-09).  Never let logind act on that switch.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
