[Service]
# erhai: replace stock systemd-sleep (which does `echo mem` straight into the
# default mem_sleep = deep = firmware 0s no-op) with the proven s2idle harness.
# Manual power-button wake (RTC_ALARM=0), display-off-first + WLAN quiesce,
# full restore after resume. See /usr/local/sbin/erhai-suspend-gnome.sh.
ExecStart=
ExecStart=/usr/local/sbin/erhai-suspend-gnome.sh
TimeoutSec=infinity
# ...but a SHUTDOWN must never wait forever on this unit.  2026-10-21: a stuck
# abort path (a hung `rmmod wlan` inside the WLAN-guard recovery) left the unit
# active with TimeoutSec=infinity, and the owner's PLAIN reboot then hung until
# he hard-reset.  The start side stays unbounded (a real suspend IS the unit
# running); only the stop side is bounded.
TimeoutStopSec=90
