[Service]
# The GDM greeter's PipeWire/WirePlumber still holds the Qualcomm ADSP for a
# few seconds after login.  Opening the device in that window wedges the DSP
# (qcom-apm command timeouts, WirePlumber stuck in D state), so wait for the
# greeter's audio stack to exit first.  See erhai-wait-greeter-audio.sh.
ExecStartPre=
ExecStartPre=/usr/local/sbin/erhai-wait-greeter-audio.sh
