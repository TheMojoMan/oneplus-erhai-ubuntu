[Service]
# The GDM greeter must never open the Qualcomm ADSP: its audio stack randomly
# wedges the DSP (qcom-apm GPR command timeouts, WirePlumber stuck in kernel D
# state), which leaves the next user session without audio.  The greeter is a
# dynamic user, so the guard resolves it through loginctl.
# See /usr/local/sbin/erhai-audio-greeter-guard.sh.
ExecCondition=
ExecCondition=/usr/local/sbin/erhai-audio-greeter-guard.sh
