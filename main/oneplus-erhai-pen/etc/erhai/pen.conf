# erhai pen (stylus) configuration.
#
# Identifiers come from the stock firmware's OplusPen service
# (org.lineageos.pen / android_hardware_oplus/packages/Pen in the LineageOS
# erhai open-source tree, PenService.kt):
#   - the pen is a BLE HID input device
#   - OUI prefixes of the radio: F8:6F:DE (Goodix) / C0:87:06 (Maxeye)
#   - HID vendor IDs seen on it: 0x22D9 (OPPO) / 0x330A (Maxeye)

# Bluetooth MAC OUI prefixes (colon or dash separated) that identify a pen.
PEN_OUIS=F8:6F:DE C0:87:06

# HID vendor IDs (hex, no 0x) the pen reports once connected.
PEN_VENDOR_IDS=22D9 330A

# Auto-pair + trust + connect a pen the first time it shows up (yes/no)
AUTO_PAIR=yes

# BLE discovery window per scan tick, seconds.
SCAN_SECONDS=6

# How often to re-arm discovery / re-check the connection, seconds.
TICK_SECONDS=20

# Auto-connect when the pen is placed on the wireless charger (kernel +b9).
# erhai-pen-monitor watches this debugfs directory for the pen's ATTACH edge
# and starts a BLE scan + reconnect the moment it appears (the coil is what
# wakes the pen, so this is when its BLE radio advertises).  It also learns
# the pen's BLE MAC from the coil (`ble_mac_addr`) and reuses it for instant
# reconnects.  Set CONNECT_ON_ATTACH=no to disable.
CHARGER_DEBUGFS=/sys/kernel/debug/cps-wls-charger
CHARGER_POLL_SECONDS=2
CONNECT_ON_ATTACH=yes

# Attach/detach SoC toast (erhai-pen-notify.service, kernel +b10):
# how long the toast stays on screen, ms.
NOTIFY_SECONDS=5000
# notification icon (GNOME symbolic icon name; omit the -i flag when unset)
NOTIFY_ICON=input-stylus-symbolic

# Pen state of charge over BLE (erhai-pen.service -> /run/erhai-pen/soc).
# The coil (CPS8601) charges the pen, but its BATTERY LEVEL is read over
# Bluetooth exactly like stock Android's charger HAL does (it pushes the value
# into the charger driver as the writable `rx_soc` attribute -- the coil
# chip's own POWER packet is only used for a charge-full check).
SOC_ENABLE=yes
# GATT Battery Service / Battery Level (short 16-bit or full 128-bit UUID)
BATTERY_SERVICE_UUID=180f
BATTERY_LEVEL_UUID=2a19
# /run/erhai-pen/soc older than this (seconds) is not trusted by the toast
SOC_FRESH_SECONDS=900