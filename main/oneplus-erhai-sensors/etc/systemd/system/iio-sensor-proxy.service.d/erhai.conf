# erhai: use the SSC-enabled iio-sensor-proxy 3.9 build from /usr/local
# (the distro package's 3.8 has no SSC backend). Drop-in override keeps the
# distro unit file untouched. Do NOT restart the service on package upgrades:
# mutter/gsd-power do not re-claim after a proxy restart (see
# MEMORY-2026-09-06) -- a relogin picks the new binary up.
#
# RestrictAddressFamilies MUST include AF_QIPCRTR: older distro packages
# (iio-sensor-proxy 3.8-1 on the first shipped image) omit it from their
# sandbox, and the proxy then dies at boot with "QRTR bus unavailable" —
# no accelerometer/ALS, no auto-rotate, no auto-brightness. An assignment
# in a drop-in replaces the parent list, so spell out the full set.
# Restart=always is a self-healing safety net: in normal operation the
# proxy never exits; it only exits when it cannot initialize (e.g. QRTR
# not ready yet), and then it should come back once the stack is up.
[Unit]
StartLimitIntervalSec=0

[Service]
ExecStart=
ExecStart=/usr/local/libexec/iio-sensor-proxy
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR
Restart=always
RestartSec=2
