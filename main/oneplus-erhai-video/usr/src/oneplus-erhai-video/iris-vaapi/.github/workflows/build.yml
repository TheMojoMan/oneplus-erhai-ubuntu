name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Verify ARM64 runner
        run: test "$(uname -m)" = aarch64
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libva-dev libdrm-dev pkg-config
      - name: Build
        run: make -j"$(nproc)"
      - name: Unit tests
        run: make check
