# erhai WiFi backend: mainline ath12k (ONE backend per PCIe endpoint).
#
# The WCN7860 is a single PCI function (0000:01:00.0) and only one driver can
# own it.  ath12k loads through its PCI modalias; the vendor stack must never
# grab the endpoint first:
#   cnss2 - the shim that powers the chip and starts the qcacld firmware
#   wlan  - qcacld-3.0 (CONFIG_QCA_CLD_WLAN=m), which also carries the
#           same PCI modalias and would otherwise be autoloaded by udev
# The vendor path in this package is kept for a manual fallback only; see
# /usr/share/oneplus-erhai-wifi/README.md.
blacklist cnss2
blacklist wlan
