[Service]
# Greeter seeding only: copies monitors.xml + the greeter dconf db into the
# greeter fresh dynamic HOME and its XDG_CONFIG_HOME (see
# /usr/local/sbin/erhai-greeter-monitors.sh).
# This file was erhai-mesa-opt.conf until the mesa stack moved to /usr and its
# LD_LIBRARY_PATH/VK_ICD_* Environment= lines went away.
ExecStartPre=/usr/local/sbin/erhai-greeter-monitors.sh
