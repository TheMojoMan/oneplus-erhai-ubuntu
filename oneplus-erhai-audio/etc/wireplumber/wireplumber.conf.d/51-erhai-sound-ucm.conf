# OnePlus Pad 3 (erhai) — force the native ALSA UCM path for the SM8750
# AudioReach sound card.
#
# The card (device.name "alsa_card.platform-sound") is a q6apm/AudioReach DSP
# card with no analog mixer, so WirePlumber's default ACP layer can't build
# usable profiles and falls back to "Pro Audio" + "Off" (-> GNOME shows only
# "Dummy Output"). Disabling ACP and enabling UCM makes spa-alsa enumerate the
# UCM devices (DisplayPort, Headphones, Mic) from our profile
# (ucm2/conf.d/sm8750/OnePlus-Pad3-erhai-24976.conf) as PipeWire nodes.
#
# Deploy to /etc/wireplumber/wireplumber.conf.d/51-erhai-sound-ucm.conf

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        # This q6apm/AudioReach DSP card has no analog mixer, so WirePlumber's
        # default ACP layer can't build usable profiles (only "Pro Audio"/"Off"
        # -> GNOME shows just "Dummy Output"). ACP also can't consume our UCM
        # profile on this card. Disabling ACP makes spa-alsa expose the raw
        # MultiMedia front-end PCMs as real PipeWire sinks/sources (MM1=hw:,0,
        # MM2=hw:,1 = DisplayPort). FE->BE routing is applied by
        # erhai-audio-route.service (alsaucm set _verb HiFi).
        api.alsa.use-acp = false
      }
    }
  }
  # Friendly names for the MultiMedia front-end nodes (otherwise every node
  # shows as "Built-in Audio"). MM1=playback.0.0 -> WCD HPH (USB-C analog),
  # MM2=playback.1.0 -> DisplayPort; MM3/MM4 = capture.
  {
    matches = [ { node.name = "alsa_output.platform-sound.playback.1.0" } ]
    actions = { update-props = { node.description = "DisplayPort", node.nick = "DisplayPort" } }
  }
  {
    matches = [ { node.name = "alsa_output.platform-sound.playback.0.0" } ]
    actions = { update-props = { node.description = "Speakers", node.nick = "Speakers" } }
  }
  # Capture nodes -- the two names used to be SWAPPED, which made GNOME's
  # default input the wrong (and non-functional) device:
  #   capture.2.0 = hw:0,2 = MultiMedia3 <- TX_CODEC_DMA_TX_3: the WCD9395
  #     analog-AMIC path the internal microphones live on.  It is the device
  #     the OnePlus Pad 2 Pro mainline port exposes as "Mic / Internal
  #     microphones", it is what our DTS routes AMIC1/AMIC5 -> ADC1/ADC4 into,
  #     and it is the ONLY capture PCM that opens (arecord -D hw:0,2 works).
  #   capture.3.0 = hw:0,3 = MultiMedia4 <- VA_CODEC_DMA_TX_0: the VA-macro
  #     DMIC front-end.  `arecord -D hw:0,3` dies with pcm_read Input/output
  #     error (44-byte header), the product's own /odm mixer_paths.xml says the
  #     handset mic is ANALOG, and Android's working recording enables no DMIC
  #     mux -- so it must not be offered as, or chosen as, the default input.
  # (microphone-MEMORY-2026-09-23.md 51.6 + 2026-10-19 52.6.1)
  {
    matches = [ { node.name = "alsa_input.platform-sound.capture.2.0" } ]
    actions = { update-props = {
      node.description = "Internal Mics"
      node.nick = "Internal Mics"
      priority.session = 2000
    } }
  }
  # pipewire 1.6 creates these raw FE nodes with audio.channels = 64 (the PCM's
  # maximum) and spa.alsa then refuses to open them:
  #   spa.alsa: hw:0,2c: Channels doesn't match (requested 64, got 2)
  #   spa.alsa: given audio.channels 64 out of range:2-2
  # -> the capture node never starts, "Internal Mics" exists in WirePlumber but
  # records nothing (ErhaiCam then blocks as soon as audio is needed).  PipeWire
  # 1.4 (26.04) opened the same PCM with 2 channels.  Pin the capture nodes to
  # stereo (microphone-.26.10 measurement, 2026-10-26).
  {
    matches = [ { node.name = "~alsa_input\.platform-sound\..*" } ]
    actions = { update-props = { audio.channels = 2 } }
  }
  {
    matches = [ { node.name = "alsa_input.platform-sound.capture.3.0" } ]
    actions = { update-props = {
      node.description = "VA DMIC (inactive)"
      node.nick = "VA DMIC"
      priority.session = 100
      node.disabled = true
    } }
  }
]
