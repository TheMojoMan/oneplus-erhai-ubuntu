SectionVerb {
	EnableSequence [
		cdev "hw:0"
		# Front-end -> back-end routing for the OnePlus Pad 3 sound card.
		# MM1 (hw:,0) -> SECONDARY_MI2S_RX (internal speakers via 6x AW88261 TDM).
		# Force MM1->SEC ONLY: a stale asound.state restoring any other MM1
		# back-end (WCD/WSA/DP) would create a dual-route that fails the graph
		# (the other BE prepares with no sink -> DSP SET_CFG error -> no audio).
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		# MM2 (hw:,1) -> DisplayPort (DP-alt-mode audio out). The route is
		# needed so the DP BE graph can start when a monitor IS attached;
		# with no monitor the DP device simply stays jack-unavailable.
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1"
		# MM3 (hw:,2) <- WCD9395 TX (headset mic via USB-C analog).
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		# MM4 (hw:,3) <- VA macro DMICs (internal mics).
		cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 1"
		# AW88261 speaker amp volume. On v7.2 the "PCM Playback Volume" control is
		# inverted vs v7.1 (SOC_SINGLE_EXT_TLV, range 0-360, 0 = MUTE), so a fresh
		# card -- or a stale v7.1 asound.state -- comes up silent even though all
		# six amps PLL-lock. 320 is about -10 dB; raise for louder. Kept in the
		# verb so WirePlumber's ACP (or `alsaucm set _verb HiFi`) applies it
		# automatically, replacing the old erhai-audio-route.service step.
		cset "name='Spk0 PCM Playback Volume' 320"
		cset "name='Spk1 PCM Playback Volume' 320"
		cset "name='Spk2 PCM Playback Volume' 320"
		cset "name='Spk3 PCM Playback Volume' 320"
		cset "name='Spk5 PCM Playback Volume' 320"
		cset "name='Spk6 PCM Playback Volume' 320"
	]

	Include.wcde.File "/codecs/wcd939x/DefaultEnableSeq.conf"

	Value {
		TQ "HiFi"
	}
}

# DisplayPort audio over USB-C alt-mode. Jack-gated: WirePlumber only offers
# this output while 'DP0 Jack' reports plugged (i.e. a USB-C monitor that
# carries audio). Needs the MM2 -> DISPLAY_PORT_RX_0 route (kept in the verb
# AND re-applied here on device enable).
# Re-enabled 2026-08-27 on kernel v7.2-rc4+ and PipeWire 1.6.2/WP 0.5.13:
# with a monitor attached the DP BE graph starts fine once the route cset is
# applied, and ACP no longer drops the WHOLE profile when an unplug-time
# probe of hw:,1 fails — it just leaves that one node missing.
SectionDevice."DisplayPort" {
	Comment "DisplayPort"

	EnableSequence [
		cdev "hw:${CardId}"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		# sc8280xp.c registers the DP jack as "DP<dp_pcm_id> Jack";
		# DISPLAY_PORT_RX_0 -> dp_pcm_id 0 -> "DP0 Jack". Drives hotplug
		# detection so the monitor output appears/disappears automatically.
		JackControl "DP0 Jack"
	}
}

SectionDevice."Speaker" {
	Comment "Internal Speaker"

	Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP Digital"
		# NOTE: no JackControl here on purpose — ACP/WirePlumber won't build a
		# UCM profile if EVERY output is jack-gated-unavailable (DP unplugged +
		# headset unplugged). Leaving the internal speaker always-available
		# gives ACP one usable output so the HiFi profile always appears.
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	# Ground truth (OxygenOS tinymix diff, adb capture 2026-08-26):
	# the internal mics are ANALOG AMICs on the WCD9395:
	#   AMIC1 -> ADC1 -> swr2 slot 9 (SWR_MIC9)
	#   AMIC5 -> ADC4 -> swr2 slot 4 (SWR_MIC4)
	# captured through tx-macro AIF1 -> CODEC_DMA RXTX-TX3 (MultiMedia3).
	# NOT the va-macro DMIC pins (those deliver only idle hash).
	# ADC_NORMAL mode; ADC_HIFI rails into clipping. Volume 0 = mute!

	EnableSequence [
		cdev "hw:0"
		cset "name='ADC1 MUX' 1"
		cset "name='ADC4 MUX' 4"
		cset "name='ADC1 Switch' on"
		cset "name='ADC4 Switch' on"
		cset "name='ADC1_MIXER Switch' on"
		cset "name='ADC4_MIXER Switch' on"
		cset "name='TX0 MODE' 1"
		cset "name='TX3 MODE' 1"
		cset "name='TX DEC0 MUX' 1"
		cset "name='TX DEC1 MUX' 1"
		cset "name='TX SMIC MUX0' 10"
		cset "name='TX SMIC MUX1' 5"
		# keep the DMIC mux nibble (CFG0 bits 7:4) at ZERO like OxygenOS;
		# stale DMIC7 selections from other use-cases must not leak here
		cset "name='TX DMIC MUX0' 0"
		cset "name='TX DMIC MUX1' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		# Android GT capture routes ONLY DEC0/DEC1 into TX AIF1
		# (TX_AIF1_CAP Mixer DEC2..DEC7 = Off).  Sweep scripts and
		# alsa-restore leave those switches set, and nothing else in our
		# flow ever clears them, so force them off with the rest of the
		# Mic state (microphone-MEMORY-2026-09-19 §40.7).
		cset "name='TX_AIF1_CAP Mixer DEC2' 0"
		cset "name='TX_AIF1_CAP Mixer DEC3' 0"
		cset "name='TX_AIF1_CAP Mixer DEC4' 0"
		cset "name='TX_AIF1_CAP Mixer DEC5' 0"
		cset "name='TX_AIF1_CAP Mixer DEC6' 0"
		cset "name='TX_AIF1_CAP Mixer DEC7' 0"
		# Same for the va-macro capture mixers (all Off in Android's tree).
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA_AIF1_CAP Mixer DEC2' 0"
		cset "name='VA_AIF1_CAP Mixer DEC3' 0"
		cset "name='VA_AIF2_CAP Mixer DEC0' 0"
		cset "name='VA_AIF2_CAP Mixer DEC1' 0"
		cset "name='VA_AIF2_CAP Mixer DEC2' 0"
		cset "name='VA_AIF2_CAP Mixer DEC3' 0"
		cset "name='VA_AIF3_CAP Mixer DEC0' 0"
		cset "name='VA_AIF3_CAP Mixer DEC1' 0"
		cset "name='VA_AIF3_CAP Mixer DEC2' 0"
		cset "name='VA_AIF3_CAP Mixer DEC3' 0"
		cset "name='ADC1 Volume' 12"
		cset "name='ADC4 Volume' 12"
	]

	DisableSequence [
		cdev "hw:0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		# leave the tree in Android's idle shape (DEC2..DEC7 off)
		cset "name='TX_AIF1_CAP Mixer DEC2' 0"
		cset "name='TX_AIF1_CAP Mixer DEC3' 0"
		cset "name='TX_AIF1_CAP Mixer DEC4' 0"
		cset "name='TX_AIF1_CAP Mixer DEC5' 0"
		cset "name='TX_AIF1_CAP Mixer DEC6' 0"
		cset "name='TX_AIF1_CAP Mixer DEC7' 0"
		cset "name='ADC1 Switch' off"
		cset "name='ADC4 Switch' off"
		cset "name='ADC1_MIXER Switch' off"
		cset "name='ADC4_MIXER Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}