# ALSA Use Case Manager profile for the OnePlus Pad 3 (erhai), SM8750.
#
# Card: driver "sm8750" (qcom,sm8750-sndcard -> sc8280xp.c machine driver),
# name/model "OnePlus-Pad-3" (DT `model`). Selected by alsa-ucm-conf
# (ucm2/ucm.conf lookup) via either of:
#   conf.d/sm8750/OnePlus-Pad3-erhai-24976.conf   (CardLongName match)
#   conf.d/sm8750/sm8750.conf                     (CardDriver match)
# both symlinks to this file. Installed by the oneplus-erhai-audio package.
#
# Differs from the upstream SM8750-MTP profile:
#   - NO WSA SoundWire speakers (the Pad 3's 6x Awinic AW88261 amps are I2C/TDM
#     and currently disabled in DT; speaker bring-up = separate task). So the
#     WSA Speaker device, WSA init/enable includes and the Spkr PA BootSequence
#     are all dropped.
#   - ADDS a "DisplayPort" output device (DP-alt-mode audio over USB-C), routed
#     through the DISPLAY_PORT_RX_0 AudioReach backend (DT dp-dai-link).
#   - "Headphones" = the WCD9395 HPH, which on the Pad 3 only exits via the
#     USB-C analog mux (no 3.5mm jack) -> needs a USB-C analog dongle.

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8750/OnePlusPad3/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd939x/init.conf"
