# erhai (OnePlus Pad 3) — GDM.
#
# NOTE: gdm.service itself is DISABLED on this device; erhai-touchscreen.service
# starts it once the in-cell NT36536 touch controller reports "boot firmware
# ready". The panel is in-cell, so the touch sensing layer only syncs to the
# display during a display-manager bring-up — a rebind after the session is up
# does not help.
[daemon]
AutomaticLoginEnable=True
AutomaticLogin=@USERNAME@
WaylandEnable=true

[security]

[xdmcp]

[chooser]

[debug]
