# erhai: /run/systemd/seats/ may not exist yet when this unit is pulled in by
# graphical.target (before logind created it) -> mount namespace setup fails
# with status=226/NAMESPACE on early start (self-recovers via D-Bus activation).
# Upstream lists this path without the "-" optional prefix; make it optional.
[Service]
ReadOnlyPaths=
ReadOnlyPaths=/usr/share/accountsservice/interfaces/ /usr/share/dbus-1/interfaces/ /var/log/wtmp -/run/systemd/seats/