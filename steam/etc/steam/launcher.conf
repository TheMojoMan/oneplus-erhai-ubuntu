# /etc/steam/launcher.conf -- sourced by /usr/bin/steam before it starts the
# client.  Every line is commented out: the defaults work everywhere.
#
# This file is root-owned system configuration (a user session cannot edit
# it), which is why machine-wide graphics/FEX overrides belong here rather
# than in a per-user file.  Re-login is not needed after an edit; the launcher
# reads it on every start.

# --- GPU user-space driver -------------------------------------------------
# Distro Mesa too old for the GPU in use (e.g. the OnePlus Pad 3's Adreno 830)
# can be pointed at a private Mesa tree.  Leave this alone when the system
# Mesa already drives the GPU.
#export LD_LIBRARY_PATH=/opt/mesa/lib/aarch64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
#export VK_DRIVER_FILES=/opt/mesa/share/vulkan/icd.d/freedreno_icd.aarch64.json
#
# Pinning the loader is sometimes needed instead of the library path:
#export GALLIUM_DRIVER=freedreno

# --- x86-64 games (host FEX) ----------------------------------------------
# Steam's ARM client runs Windows titles through Proton ARM (FEX inside
# Proton).  A native x86-64 LINUX game additionally needs a host FEX rootfs;
# point at one if it exists on this machine.
#export FEX_ROOTFS=/media/data/x86_rootfs-26

# --- Steam data location ---------------------------------------------------
# Where the Steam data lives (the client it downloads, plus every game).  On a
# first start the launcher ASKS, with a list of the writable partitions that
# have room, and remembers the answer in ~/.config/erhai-steam.conf (per user,
# delete that file or run "STEAM_ASK_HOME=1 steam" to be asked again).
#
# Setting STEAM_HOME HERE overrides that for EVERY account on the machine and
# suppresses the dialog (useful on a single-user machine whose data belongs on
# a bigger partition):
#export STEAM_HOME=/media/data/PC-Games/Steam
#
# The dialog only offers partitions with at least this much free space (GB).
# tmpfs/ramfs are never offered: data there would not survive a reboot.
#export MIN_FREE_GB=8
#
# A different read-only bootstrap tree (testing a rebuild):
#export STEAM_PAYLOAD_DIR=/usr/lib/steam
